<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f5c43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="نظام" />
  <title>نظام – تنظيم الحياة والوقت</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f4efe3;
      --card:#fffdf8;
      --tx:#17251f;
      --mu:#78857d;
      --pr:#0f5c43;
      --pr2:#1b8a65;
      --ac:#c19a3e;
      --bd:#ebe3cf;
      --shadow:0 12px 30px -18px rgba(15,60,43,.24);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0a110e;
        --card:#121d17;
        --tx:#eef3ee;
        --mu:#8da096;
        --pr:#2fae80;
        --pr2:#1b8a65;
        --ac:#e0b858;
        --bd:#1f2e26;
      }
    }

    :root[data-theme="dark"]{
      --bg:#0a110e;
      --card:#121d17;
      --tx:#eef3ee;
      --mu:#8da096;
      --pr:#2fae80;
      --pr2:#1b8a65;
      --ac:#e0b858;
      --bd:#1f2e26;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body{
      margin:0;
      font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;
      background:
        radial-gradient(circle at top right, rgba(193,154,62,.18), transparent 30%),
        radial-gradient(circle at top left, rgba(27,138,101,.08), transparent 25%),
        var(--bg);
      color:var(--tx);
      max-width:560px;
      margin:0 auto;
      padding:0 0 114px;
      line-height:1.6;
      min-height:100vh;
      position:relative;
      -webkit-tap-highlight-color: transparent;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0 0 auto 0;
      height:260px;
      background:linear-gradient(180deg, rgba(255,255,255,.12), transparent);
      pointer-events:none;
      z-index:0;
    }

    header{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:calc(18px + var(--safe-top)) 18px 8px;
    }

    h1,h2,h3,p{ margin:0; }
    h1{
      font-size:26px;
      font-weight:800;
      letter-spacing:.5px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    h1 span{
      background:linear-gradient(90deg,var(--ac),var(--pr2));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      display:inline-block;
    }
    h2{
      font-size:15px;
      font-weight:700;
      color:var(--pr);
      margin-bottom:8px;
    }

    .mu{ color:var(--mu); font-size:13px; }
    .small{ font-size:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--bd);
      border-radius:22px;
      padding:18px;
      margin:12px 14px;
      box-shadow:var(--shadow);
      position:relative;
      z-index:1;
      animation:appear .45s ease both;
    }
    @keyframes appear{
      from{ opacity:0; transform:translateY(12px); }
      to{ opacity:1; transform:none; }
    }

    .verse{
      position:relative;
      overflow:hidden;
      background:linear-gradient(135deg,#0b4a35,#0f5c43 58%,#157a58);
      border:1px solid rgba(224,184,88,.4);
      color:#fffaf0;
      padding:24px 18px 18px;
    }
    .verse::before{
      content:"";
      position:absolute;
      inset:0;
      opacity:.10;
      background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.9) 0 5deg, transparent 5deg 22deg);
      -webkit-mask:radial-gradient(circle at center, #000 0, transparent 72%);
      mask:radial-gradient(circle at center, #000 0, transparent 72%);
      pointer-events:none;
    }
    .verse > *{ position:relative; z-index:1; }
    .verse .a{
      font-family:"Amiri","Noto Naskh Arabic",serif;
      font-size:28px;
      line-height:2.1;
      text-align:center;
      margin-bottom:8px;
    }
    .verse .r{
      text-align:center;
      color:#e0b858;
      letter-spacing:.5px;
      font-size:12px;
      font-weight:700;
    }

    .hero{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 18px 16px;
    }
    .big{
      font-size:28px;
      font-weight:800;
      color:var(--tx);
      letter-spacing:.2px;
    }
    .ring{
      position:relative;
      width:90px;
      height:90px;
      display:grid;
      place-items:center;
      flex:none;
    }
    .ring svg{
      transform:rotate(-90deg);
      width:90px;
      height:90px;
    }
    .ring circle.bg{
      fill:none;
      stroke:var(--bd);
      stroke-width:8;
    }
    .ring circle.fill{
      fill:none;
      stroke:var(--ac);
      stroke-width:8;
      stroke-linecap:round;
      transition:stroke-dasharray .4s ease;
    }
    .ring b{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      font-weight:800;
      color:var(--pr);
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .row.between{ justify-content:space-between; }

    .btn{
      font:inherit;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg, var(--pr2), var(--pr));
      color:#fff;
      padding:10px 16px;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 8px 18px -10px var(--pr);
      transition:transform .15s ease, opacity .15s ease;
    }
    .btn:active{ transform:scale(.97); }
    .btn.secondary{
      background:transparent;
      color:var(--pr);
      border:1.5px solid var(--pr);
      box-shadow:none;
    }
    .btn.ghost{
      background:transparent;
      color:var(--mu);
      border:1px solid var(--bd);
      box-shadow:none;
      padding:8px 12px;
    }
    .btn.small{
      padding:8px 12px;
      font-size:12px;
      border-radius:12px;
    }

    input, select{
      width:100%;
      border:1.5px solid var(--bd);
      border-radius:14px;
      background:var(--bg);
      color:var(--tx);
      padding:11px 12px;
      font:inherit;
      outline:none;
    }
    input:focus, select:focus{
      border-color:var(--ac);
      box-shadow:0 0 0 3px rgba(193,154,62,.1);
    }

    .it{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid var(--bd);
    }
    .it:last-child{ border-bottom:none; }
    .task-title{
      flex:1;
      min-width:0;
      word-break:break-word;
    }
    .task-title.done{
      text-decoration:line-through;
      color:var(--mu);
    }

    .checkbox{
      width:30px;
      height:30px;
      border-radius:50%;
      border:2px solid var(--ac);
      background:transparent;
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
      font-weight:700;
      padding:0;
      flex:none;
    }
    .checkbox.on{
      background:linear-gradient(135deg,var(--ac),#9a7420);
      border-color:var(--ac);
    }

    .bar{
      height:10px;
      background:var(--bd);
      border-radius:999px;
      overflow:hidden;
      width:100%;
      position:relative;
    }
    .bar i{
      display:block;
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--ac),var(--pr2));
      border-radius:999px;
      transition:width .4s ease;
    }

    .warn{
      background:rgba(193,154,62,.12);
      border:1px solid rgba(193,154,62,.45);
      border-radius:14px;
      padding:10px 12px;
      margin-top:10px;
      color:var(--tx);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:72px;
      border-radius:12px;
      padding:8px 12px;
      background:transparent;
      color:var(--pr);
      border:1.5px solid var(--pr);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .pill.active{
      background:var(--pr);
      color:#fff;
      border-color:var(--pr);
    }

    nav{
      position:fixed;
      left:14px;
      right:14px;
      bottom:calc(10px + var(--safe-bottom));
      max-width:532px;
      margin:auto;
      z-index:20;
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:6px;
      padding:6px;
      border-radius:24px;
      background:rgba(255,255,255,.72);
      border:1px solid var(--bd);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 16px 40px -18px rgba(0,0,0,.35);
    }

    nav button{
      border:none;
      background:none;
      color:var(--mu);
      border-radius:18px;
      padding:8px 4px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      font:inherit;
      font-size:11px;
      font-weight:700;
      cursor:pointer;
    }
    nav button svg{
      width:22px;
      height:22px;
      display:block;
    }
    nav button.active{
      background:linear-gradient(135deg,var(--pr2),var(--pr));
      color:#fff;
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:60;
      background:radial-gradient(circle at 50% 25%, rgba(224,184,88,.22), transparent 42%), linear-gradient(160deg,#08382a,#0f5c43 60%,#157a58);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      transition:opacity .45s ease;
    }
    .overlay.hidden{
      opacity:0;
      pointer-events:none;
    }
    .overlay .box{
      color:#fffaf0;
      max-width:360px;
    }
    .overlay .greeting{
      font-size:18px;
      color:#e0b858;
      margin-bottom:18px;
      letter-spacing:1px;
    }
    .overlay .verse{
      background:none;
      box-shadow:none;
      border:none;
      padding:0;
      margin:0;
      animation:none;
    }
    .overlay .verse .a{
      font-size:30px;
      margin:0;
    }
    .overlay .verse .r{
      margin-top:8px;
      font-size:13px;
    }
    .overlay button{
      margin-top:24px;
      padding:12px 28px;
      border-radius:24px;
      border:1px solid rgba(224,184,88,.7);
      background:rgba(255,255,255,.12);
      color:#fffaf0;
      font-weight:700;
      cursor:pointer;
    }

    .toast{
      position:fixed;
      top:calc(12px + var(--safe-top));
      left:14px;
      right:14px;
      margin:auto;
      max-width:532px;
      z-index:70;
      background:var(--pr);
      color:#fff;
      border:1px solid rgba(224,184,88,.8);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:12px 16px;
      transform:translateY(-160%);
      transition:transform .35s ease;
      font-weight:700;
    }
    .toast.show{ transform:none; }

    @media (max-width:420px){
      .hero{ gap:12px; }
      .big{ font-size:22px; }
      .ring{ transform:scale(.9); }
      nav{ grid-template-columns:repeat(5,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"></path>
        <path d="M5 19L14 10"></path>
      </svg>
      <span>نظام</span>
    </h1>
    <div class="mu" id="dateText"></div>
  </header>

  <main id="app"></main>
  <nav id="nav"></nav>

  <script>
    const STORAGE_KEY = "nizam_app_v2";
    const VERSES = [
      ["إِنَّ مَعَ الْعُسْرِ يُسْرًا", "الشرح: 6", "g"],
      ["وَقُل رَّبِّ زِدْنِي عِلْمًا", "طه: 114", "s"],
      ["يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ", "المجادلة: 11", "s"],
      ["وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ", "النجم: 39", "s"],
      ["وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ", "البقرة: 45", "g"],
      ["وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ", "الطلاق: 3", "g"],
      ["فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ", "آل عمران: 159", "g"],
      ["لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا", "البقرة: 286", "g"],
      ["إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا", "النساء: 103", "p"],
      ["حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ", "البقرة: 238", "p"],
      ["وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا", "الطلاق: 2", "g"],
      ["أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", "الرعد: 28", "g"],
      ["فَاذْكُرُونِي أَذْكُرْكُمْ", "البقرة: 152", "g"],
      ["إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", "البقرة: 153", "g"],
      ["رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", "طه: 25-26", "s"],
      ["هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ", "الزمر: 9", "s"],
      ["فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ", "غافر: 55", "g"],
      ["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ", "الضحى: 5", "g"],
      ["وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "طه: 14", "p"],
      ["إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ", "العنكبوت: 45", "p"],
      ["وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ", "التوبة: 105", "g"]
    ];

    const PRAYER_NAMES = [
      ["fajr","الفجر"],
      ["dhuhr","الظهر"],
      ["asr","العصر"],
      ["maghrib","المغرب"],
      ["isha","العشاء"]
    ];

    const DEFAULT_STATE = {
      tasks: [],
      prayers: {},
      log: {},
      savedVerses: [],
      subjects: ["مادة 1"],
      study: { running:false, left:1500, elapsed:0, currentSubject:0, paused:null },
      location: { lat:30.0444, lng:31.2357, name:"القاهرة" },
      budget:180,
      exams:[],
      notifications:true,
      azkar:{},
      lastVerseIndex:0,
      theme:"light"
    };

    let appState = loadState();
    let activeTab = 0;
    let currentVerseIndex = appState.lastVerseIndex || 0;
    let azkarMode = "morning";
    let toastTimer = null;
    let studyTimer = null;
    let fired = new Set();

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return { ...structuredClone(DEFAULT_STATE), ...parsed };
      }catch{
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function esc(str){
      return String(str).replace(/[&<>\"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    }

    function formatClock(date){
      return date.toLocaleTimeString("ar-EG", { hour:"2-digit", minute:"2-digit" });
    }

    function formatDurationSec(total){
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return String(minutes).padStart(2,"0") + ":" + String(seconds).padStart(2,"0");
    }

    function getTodayKey(date = new Date()){
      const d = new Date(date);
      d.setHours(0,0,0,0);
      return d.toISOString().slice(0,10);
    }

    function toast(msg){
      let el = document.getElementById("toast");
      if(!el){
        el = document.createElement("div");
        el.id = "toast";
        el.className = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>el.classList.remove("show"), 3500);
    }

    function prayerTimes(date){
      const lat = appState.location.lat;
      const lng = appState.location.lng;
      const tz = -date.getTimezoneOffset() / 60;
      const D = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000 + 2440587.5 - 2451545;
      const g = ((357.529 + 0.98560028 * D) % 360) * Math.PI / 180;
      const q = ((280.459 + 0.98564736 * D) % 360) * Math.PI / 180;
      const L = ((q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2*g)) % 360) * Math.PI / 180;
      const e = (23.439 - 4e-7 * D) * Math.PI / 180;
      const RA = (Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / Math.PI / 180 / 15 + 24) % 24;
      const dec = Math.asin(Math.sin(e) * Math.sin(L));
      let eq = q / Math.PI / 180 / 15 - RA;
      eq = ((eq + 12) % 24 + 24) % 24 - 12;
      const noon = 12 + tz - lng / 15 - eq;
      const la = lat * Math.PI / 180;

      const acosMinutes = (angleDeg) => {
        const a = angleDeg * Math.PI / 180;
        const cosValue = (Math.sin(a) - Math.sin(la) * Math.sin(dec)) / (Math.cos(la) * Math.cos(dec));
        return Math.acos(Math.max(-1, Math.min(1, cosValue))) / Math.PI / 180 / 15;
      };

      const asrA = Math.atan(1 / (1 + Math.tan(Math.abs(la - dec)))) / Math.PI / 180;
      const h = {
        fajr: noon - acosMinutes(-19.5),
        dhuhr: noon + 0.04,
        asr: noon + acosMinutes(asrA),
        maghrib: noon + acosMinutes(-0.833) + 0.02,
        isha: noon + acosMinutes(-17.5)
      };

      const out = {};
      for (const [key] of PRAYER_NAMES) {
        const dt = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        dt.setMinutes(Math.round(h[key] * 60));
        out[key] = dt;
      }
      return out;
    }

    function nextPrayer(){
      const now = new Date();
      const today = prayerTimes(now);
      for (const [key, label] of PRAYER_NAMES) {
        if (today[key] > now) return { key, label, time: today[key] };
      }
      const tomorrow = prayerTimes(new Date(now.getTime() + 86400000));
      return { key:"fajr", label:"الفجر", time: tomorrow.fajr };
    }

    function prayerProgress(){
      const dayKey = getTodayKey();
      const todayPrayers = appState.prayers[dayKey] || {};
      return Object.values(todayPrayers).filter(Boolean).length;
    }

    function dailyLogMinutes(dateKey){
      const day = appState.log[dateKey] || {};
      return Object.values(day).reduce((sum, val) => sum + Number(val || 0), 0);
    }

    function renderHome(){
      const now = new Date();
      const next = nextPrayer();
      const todayPrayers = appState.prayers[getTodayKey()] || {};
      const todayMinutes = dailyLogMinutes(getTodayKey());
      const totalCompleted = prayerProgress();
      const verse = VERSES[appState.lastVerseIndex] || VERSES[0];
      const tasksOpen = appState.tasks.filter(t => !t.done).slice(0,4);
      const diffMin = Math.max(0, Math.round((next.time - now) / 60000));
      const hours = Math.floor(diffMin / 60);
      const minutes = diffMin % 60;

      return `
        <section class="card verse">

    function renderPlan(){
      const today = new Date();
      today.setHours(0,0,0,0);

      const exams = (appState.exams || []).map((e, idx) => ({

        idx,
        remaining: Math.round((new Date(e.date + "T00:00") - today) / 86400000)

      const weights = exams.map(e => 1 / (e.remaining + 1));
      const totalWeight = weights.reduce((sum,v)=> sum + v, 0) || 1;
      const budget = Number(appState.budget) || 180;
      const studyLog = appState.log[getTodayKey()] || {};

        const suggested = Math.round((budget * weights[index] / totalWeight) / 5) * 5;

        const percent = Math.min(100, (studied / Math.max(1, suggested)) * 100);
        return `

    const navIcons = [

      const input = document.getElementById("newSubjectInput");

      if(!value) return;
      appState.subjects.push(value);

    function deleteSubject(index){
      if(appState.subjects.length <= 1) return;

    function addAzkar(index){
      const list = [
        ["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", 3],
        ["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", 3],
        ["حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", 7],
        ["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", 100],
        ["لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", 10],
        ["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", 100],
        ["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ", 10]
      ];
      const selected = list[index];
      if(!selected) return;

      const todayKey = getTodayKey() + azkarMode;
      appState.azkar[todayKey] = appState.azkar[todayKey] || {};
      const text = selected[0];
      const goal = selected[1];
      const current = appState.azkar[todayKey][text] || 0;
      if(current < goal){
        appState.azkar[todayKey][text] = current + 1;
      }
      saveState();
      render();
    }

    function inPrayer(){
      const now = new Date();
      const times = prayerTimes(now);
      for (const [key,label] of PRAYER_NAMES) {
        if (now >= times[key] && now - times[key] < 20 * 60 * 1000) return label;
      }
      return null;
    }

    function logStudyMinute(seconds, subjectIndex){
      const key = getTodayKey();
      const subjectName = appState.subjects[subjectIndex] || "عام";
      appState.log[key] = appState.log[key] || {};
      appState.log[key][subjectName] = (appState.log[key][subjectName] || 0) + seconds;
      saveState();
    }

    function toggleStudyTimer(){
      const study = appState.study;
      if (study.running) {
        study.running = false;
        clearInterval(studyTimer);
        studyTimer = null;
        study.elapsed = 0;
      } else {
        const prayerNow = inPrayer();
        if (prayerNow) {
          study.paused = prayerNow;
          render();
          toast("حان وقت الصلاة، المؤقت متوقف مؤقتًا");
          return;
        }
        study.running = true;
        study.paused = null;
        studyTimer = setInterval(() => {
          const s = appState.study;
          if (s.left <= 0) {
            s.running = false;
            clearInterval(studyTimer);
            studyTimer = null;
            s.left = 1500;
            s.elapsed = 0;
            saveState();
            render();
            toast("انتهى المؤقت 🎯");
            return;
          }

          const prayerNow = inPrayer();
          if (prayerNow) {
            s.running = false;
            s.paused = prayerNow;
            clearInterval(studyTimer);
            studyTimer = null;
            saveState();
            render();
            return;
          }

          s.left -= 1;
          s.elapsed += 1;

          if (s.elapsed % 60 === 0) {
            logStudyMinute(60, s.currentSubject);
          }

          if (s.left === 0) {
            s.left = 1500;
            s.elapsed = 0;
          }

          saveState();
          render();
        }, 1000);
      }
      saveState();
      render();
    }

    function useLocation(){
      if (!navigator.geolocation) {
        toast("الجهاز لا يدعم الموقع");
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        appState.location = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          name: "موقعي"
        };
        saveState();
        render();
        toast("تم تحديث موقعك");
      }, () => {
        toast("تعذر تحديد الموقع، سيتم استخدام القاهرة");
      });
    }

    function toggleNotifications(){
      appState.notifications = !appState.notifications;
      saveState();
      render();
    }

    function sendAlerts(){
      if (!appState.notifications) return;
      const now = new Date();
      const times = prayerTimes(now);
      const events = [];
      for (const [key,label] of PRAYER_NAMES) {
        const minsLeft = Math.round((times[key] - now) / 60000);
        if (minsLeft === 10) events.push(`باقي 10 دقائق على صلاة ${label}`);
        if (minsLeft === 0) events.push(`حان الآن موعد صلاة ${label}`);
      }
      if (Math.round((now - times.fajr) / 60000) === 30) events.push("وقت أذكار الصباح");
      if (Math.round((now - times.asr) / 60000) === 30) events.push("وقت أذكار المساء");

      for (const msg of events) {
        const key = msg + getTodayKey();
        if (!fired.has(key)) {
          fired.add(key);
          toast(msg);
        }
      }
    }

    function showSplash(){
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const verse = VERSES[appState.lastVerseIndex] || VERSES[0];
      overlay.innerHTML = `
        <div class="box">
          <div class="greeting">${new Date().getHours() < 12 ? "صباح الخير" : new Date().getHours() < 18 ? "نهارك سعيد" : "مساء الخير"}</div>
          <div class="verse">
            <div class="a">﴿ ${esc(verse[0])} ﴾</div>
            <div class="r">${esc(verse[1])}</div>
          </div>
          <button>ابدأ يومك</button>
        </div>
      `;
      overlay.querySelector("button").addEventListener("click", () => {
        overlay.classList.add("hidden");
        setTimeout(() => overlay.remove(), 500);
      });
      document.body.appendChild(overlay);
    }

    function boot(){
      if (!appState.lastVerseIndex) {
        appState.lastVerseIndex = Math.floor(Math.random() * VERSES.length);
        saveState();
      }
      render();
      setInterval(() => {
        if (activeTab === 0 && !appState.study.running) render();
      }, 30000);

      setInterval(sendAlerts, 20000);
      showSplash();
    }

    boot();
  </script>
</body>
</html>
